name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go checks (shaders in sync, iOS core)
        run: |
          go vet .
          go test -run 'TestMetalShaders|TestMobileFacade' -v .

      - name: Build Go core for iOS
        run: ios/build-go.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app for the simulator (unsigned)
        run: |
          cd ios
          xcodebuild -project VaporwaveEndless3D.xcodeproj -target VaporwaveEndless3D \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -60
          test ${PIPESTATUS[0]} -eq 0
