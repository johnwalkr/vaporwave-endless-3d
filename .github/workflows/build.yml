name: Build and publish Quest web app

on:
  push:
    branches: [quest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go checks
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/webxr
          go test -run 'TestMobileFacade|TestMetalShaders' .

      - name: Build web app
        run: web/build.sh

      - name: Publish to the gh-pages branch (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898299+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish Quest web app"
