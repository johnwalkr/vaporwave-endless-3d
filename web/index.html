<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaporwave Endless 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 20px; top: 14px; right: 20px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #title { font-size: 26px; font-weight: 800; transition: opacity .4s; }
  #info, #fps { font-size: 12px; opacity: .85; }
  #fps { position: fixed; right: 20px; top: 14px; }
  #toast { position: fixed; left: 20px; bottom: 16px; font-size: 13px; max-width: 60%; text-shadow: 1px 1px 2px #000; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(circle at 50% 40%, #3a0f5c, #0b0217 70%); text-align: center; padding: 20px; }
  #start h1 { margin: 0; font-size: 44px; letter-spacing: 2px;
    background: linear-gradient(90deg, #ff71ce, #01cdfe, #05ffa1); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; max-width: 640px; opacity: .85; }
  .btn { font: inherit; font-size: 20px; font-weight: 700; color: #fff; background: #ff71ce22; border: 2px solid #ff71ce;
    border-radius: 14px; padding: 14px 34px; cursor: pointer; min-width: 260px; }
  .btn:hover { background: #ff71ce55; }
  .btn.alt { border-color: #01cdfe; background: #01cdfe22; font-size: 16px; }
  #status { font-size: 12px; opacity: .7; min-height: 1.4em; }
  #bar { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 10px; }
  #bar button { font: inherit; font-size: 13px; color: #fff; background: #0008; border: 1px solid #fff5; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #menu { position: fixed; right: 16px; top: 16px; bottom: 64px; width: min(460px, 92vw); overflow: auto; background: #0b0217ee;
    border: 1px solid #ff71ce88; border-radius: 14px; padding: 8px 14px; display: none; }
  #menu h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: 2px; color: #01cdfe; }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .row span.l { flex: 1; }
  .row span.v { min-width: 150px; text-align: center; }
  .row button { font: inherit; color: #fff; background: #ff71ce33; border: 1px solid #ff71ce; border-radius: 8px; padding: 2px 10px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div id="title"></div><div id="info"></div></div>
<div id="fps" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="bar" class="hidden">
  <button id="bNew">New scene</button><button id="bSpace">Space / vaporwave</button>
  <button id="bVR" class="hidden">Enter VR</button><button id="bMenu">Settings</button>
</div>
<div id="menu"></div>
<div id="start">
  <h1>VAPORWAVE ENDLESS 3D</h1>
  <p>Endless generated vaporwave and space scenes with music made on the fly. Put on your headset and look around.</p>
  <button class="btn hidden" id="enterVR">Enter VR</button>
  <button class="btn alt" id="enterFlat">Watch on this screen</button>
  <div id="status">Loading…</div>
</div>
<script src="wasm_exec.js"></script>
<script src="main.js"></script>
</body>
</html>
